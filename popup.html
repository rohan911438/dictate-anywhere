<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dictate Anywhere</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>Dictate Anywhere</h1>
      <p id="status" class="status">…</p>
      <button id="toggle" class="btn primary" type="button" disabled>Start dictation</button>

      <div class="rows">
        <div class="row"><span>API key</span><span id="key" class="tag">—</span></div>
        <div class="row"><span>Languages</span><span id="langs" class="tag">—</span></div>
        <div class="row"><span>Auto-chunk</span><span id="chunk" class="tag">—</span></div>
      </div>

      <p id="hint" class="hint"></p>

      <div class="links">
        <a id="opts" href="#">Options</a>
        <a id="shortcuts" href="#">Change hotkey</a>
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
